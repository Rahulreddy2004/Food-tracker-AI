name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan the working tree with gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact --exit-code 1

  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv sync --locked
      - run: uv run ruff format --check app tests
      - run: uv run ruff check app tests
      - run: uv run mypy app
      - run: uv run pytest -q
      - name: Audit dependencies
        run: uv export --locked --no-dev --no-hashes -o /tmp/requirements.txt && uv run pip-audit -r /tmp/requirements.txt --disable-pip --no-deps

  api-emulators:
    name: API — Firebase emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g firebase-tools
      - run: cd api && uv sync --locked
      - name: Run emulator tests
        run: >
          firebase emulators:exec --project demo-foodtracker --only auth,firestore
          "cd api && FIREBASE_PROJECT_ID=demo-foodtracker uv run pytest -m emulator -q"

  api-image:
    name: API — container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the production image
        # Without model files (they live on a release); the boot check below uses fake models.
        run: |
          docker build -t food-tracker-api:ci api
          docker image ls food-tracker-api:ci --format 'image size: {{.Size}}'
      - name: Start it and check it serves
        run: |
          docker run -d --name api -p 8080:8080 \
            -e ENV=development -e MODEL_BACKEND=fake -e DATA_BACKEND=memory -e LLM_BACKEND=fake \
            food-tracker-api:ci
          for _ in $(seq 1 30); do curl -sf localhost:8080/v1/health/ready && break; sleep 1; done
          curl -sf localhost:8080/v1/health/ready
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/meals)" = 401
          test "$(docker inspect -f '{{.Config.User}}' food-tracker-api:ci)" = api
      - if: failure()
        run: docker logs api

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0
      - run: pnpm install --frozen-lockfile
      - name: API types are up to date
        run: |
          (cd ../api && uv sync --locked)
          pnpm api:types
          git diff --exit-code -- src/lib/api/schema.d.ts src/data/dishes.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm size
      - run: pnpm audit --prod --audit-level high

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g firebase-tools
      - run: cd api && uv sync --locked
      - run: cd web && pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Run Playwright (starts emulators + API + web via scripts/dev-stack.sh)
        run: cd web && pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
