[project]
name = "food-tracker-ml"
version = "2.0.0"
description = "Convert, check and evaluate the Food Tracker models (YOLOv8 detector + EfficientNetV2-B3 Food-101)."
requires-python = ">=3.12,<3.13"
dependencies = [
    # The classifier was trained/saved with TensorFlow 2.19 (Keras 3); keep that runtime to load it.
    "tensorflow-cpu==2.19.*",
    "tf2onnx>=1.17",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxslim>=0.1.90",
    "ultralytics>=8.3.50",
    "torch>=2.6",
    "torchvision>=0.21",
    "numpy>=1.26,<2.2",
    "pillow>=11",
    "pillow-heif>=0.20",
    "datasets>=3.0",
    "tqdm>=4.66",
]

[tool.uv]
package = false

# CPU-only PyTorch (≈200 MB instead of several GB of CUDA libraries).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
