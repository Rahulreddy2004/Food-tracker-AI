[project]
name = "food-tracker-api"
version = "2.0.0"
description = "Food Tracker AI — FastAPI service: food detection + recognition, nutrition, diary and AI coach."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142,<1",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "python-multipart>=0.0.32",
    "firebase-admin>=7.7,<8",
    "google-genai>=2.27,<3",
    "httpx>=0.28,<1",
    "pillow>=12.3,<13",
    "pillow-heif>=1.8,<2",
    "numpy>=2.2,<3",
    "onnxruntime>=1.30,<2",
    "structlog>=26.1",
    "cachetools>=7.2",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "respx>=0.23",
    "ruff>=0.16",
    "mypy>=2.4",
    "types-cachetools",
    "pip-audit>=2.9",
    "onnx>=1.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "N", "C4", "PT", "RET"]
ignore = ["S101", "B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PT018"]
"scripts/**" = ["S", "T201"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.cloud.*", "pillow_heif.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "models: needs the real model files in api/models (run with -m models)",
    "emulator: needs the Firebase emulators (FIRESTORE_EMULATOR_HOST / FIREBASE_AUTH_EMULATOR_HOST)",
]
addopts = "-m 'not models and not emulator'"
filterwarnings = ["ignore::DeprecationWarning:google.*"]
