# Lint/format config for scripts/ and ml/ (the API's own config is in api/pyproject.toml).
extend = "api/pyproject.toml"

[lint.per-file-ignores]
"scripts/**" = ["S310", "S603", "S607"]
"ml/**" = ["S603"]

[lint.isort]
known-first-party = ["app", "dishes"]
# ml/common.py puts api/ on sys.path, so it must be imported before anything from `app`.
section-order = ["future", "standard-library", "third-party", "bootstrap", "first-party", "local-folder"]

[lint.isort.sections]
bootstrap = ["common"]
